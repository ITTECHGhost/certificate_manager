# =============================================================================
# config/apache_certificate_manager.conf
# Apache 2.4 Reverse Proxy & WebSocket Configuration
# For Central Server Web Fallback & Client Endpoint Proxying
# =============================================================================
#
# INSTRUCTIONS FOR APPSERV / APACHE 2.4 ON WINDOWS:
# 1. In C:\AppServ\Apache24\conf\httpd.conf, ensure the following modules are enabled:
#      LoadModule proxy_module modules/mod_proxy.so
#      LoadModule proxy_http_module modules/mod_proxy_http.so
#      LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
#      LoadModule rewrite_module modules/mod_rewrite.so
#      LoadModule headers_module modules/mod_headers.so
#
# 2. Include this file at the bottom of C:\AppServ\Apache24\conf\httpd.conf:
#      Include "F:/CR_PY/certificate_manager/config/apache_certificate_manager.conf"
#    (or copy its contents into C:\AppServ\Apache24\conf\extra\httpd-vhosts.conf)
#
# 3. Restart Apache service (net stop apache24 && net start apache24).
# =============================================================================

<VirtualHost *:80>
    ServerName certs.university.local
    ServerAlias localhost 127.0.0.1

    ProxyPreserveHost On
    ProxyTimeout 300

    # Request Header forwarding
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    RewriteEngine On

    # -------------------------------------------------------------------------
    # 1. FastAPI Backend API Proxy (Port 2030)
    # -------------------------------------------------------------------------
    ProxyPass /api http://127.0.0.1:2030/api
    ProxyPassReverse /api http://127.0.0.1:2030/api

    ProxyPass /docs http://127.0.0.1:2030/docs
    ProxyPassReverse /docs http://127.0.0.1:2030/docs

    ProxyPass /openapi.json http://127.0.0.1:2030/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:2030/openapi.json

    # -------------------------------------------------------------------------
    # 2. NiceGUI WebSockets (Port 2323)
    #    Handles NiceGUI realtime UI events, heartbeats, and slot rendering
    # -------------------------------------------------------------------------
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)           ws://127.0.0.1:2323/$1 [P,L]

    ProxyPass /_nicegui_ws ws://127.0.0.1:2323/_nicegui_ws
    ProxyPassReverse /_nicegui_ws ws://127.0.0.1:2323/_nicegui_ws

    # -------------------------------------------------------------------------
    # 3. NiceGUI Web Application Fallback (Port 2323)
    #    Serves desktop UI through modern web browser (Edge/Chrome/Firefox)
    # -------------------------------------------------------------------------
    ProxyPass / http://127.0.0.1:2323/
    ProxyPassReverse / http://127.0.0.1:2323/

    # Error logging
    ErrorLog "logs/certificate_manager_error.log"
    CustomLog "logs/certificate_manager_access.log" common
</VirtualHost>
